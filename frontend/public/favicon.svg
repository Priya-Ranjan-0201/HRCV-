<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Hex Prism Base -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" stroke="url(#logoGrad)" stroke-width="4.5" fill="#030712" filter="url(#glow)"/>
  
  <!-- Inner Dynamic Tech Chevron / Delta -->
  <path d="M50 18 L76 34 L76 66 L50 82 L24 66 L24 34 Z" fill="url(#coreGrad)" fill-opacity="0.15" stroke="url(#logoGrad)" stroke-width="2"/>
  
  <!-- Central Neural Diamond Apex -->
  <polygon points="50,30 68,44 50,70 32,44" fill="url(#logoGrad)"/>
  <circle cx="50" cy="44" r="4.5" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- Ambient Orbit Points -->
  <circle cx="50" cy="18" r="2.5" fill="#38bdf8"/>
  <circle cx="76" cy="34" r="2.5" fill="#818cf8"/>
  <circle cx="76" cy="66" r="2.5" fill="#c084fc"/>
  <circle cx="50" cy="82" r="2.5" fill="#38bdf8"/>
  <circle cx="24" cy="66" r="2.5" fill="#818cf8"/>
  <circle cx="24" cy="34" r="2.5" fill="#c084fc"/>
</svg>